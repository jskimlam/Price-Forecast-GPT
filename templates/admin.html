<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forecast DB Admin</title>
<style>body{font-family:system-ui;background:#07111d;color:#eef6ff;margin:0}.w{max-width:1100px;margin:auto;padding:18px}h1{margin:0 0 6px}.sub{color:#91a6bb}.box{background:#0c1c2d;border:1px solid #1d3c59;border-radius:16px;padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:12px;color:#9fb2c6}input{width:100%;margin-top:5px;background:#071522;border:1px solid #244863;color:#fff;padding:10px;border-radius:9px}button{background:#34c2ff;border:0;color:#06111d;font-weight:800;padding:11px 16px;border-radius:10px;cursor:pointer}.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.row{background:#0a1827;border:1px solid #173550;padding:9px;border-radius:10px}.msg{margin-top:10px;color:#8ee0b5}@media(max-width:720px){.grid,.targets{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid,.targets{grid-template-columns:1fr}}</style></head>
<body><div class="w"><h1>Price Forecast GPT · Admin</h1><div class="sub">Google Sheet 가격 입력 → Forecast 재빌드</div>
<div class="box"><div class="grid"><label>Apps Script Web App URL<input id="url" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Admin Password<input id="pw" type="password"></label><label>Assessment Date<input id="dt" type="date"></label></div></div>
<div class="box"><h3>12 Forecast Targets</h3><div class="targets" id="targets"></div><div style="margin-top:14px"><button onclick="save()">Save & Rebuild</button><div id="msg" class="msg"></div></div></div></div>
<script>
const TARGETS=[["NMCL001","WTI NYMEX"],["PAAAD00","Naphtha CFR Japan"],["AAMFI00","SM CFR China"],["AAOTM00","Ethylene CFR NE Asia"],["PHASM05","Benzene FOB Korea"],["AAWWK00","Propylene CFR China"],["PHAOO00","ACN CFR FE Asia"],["BTNEA00","BD CFR NE Asia"],["PHBIF00","PP CFR FE Asia"],["PHAIL00","PS GP CFR China"],["PHAIR00","HIPS CFR China"],["PHAHF00","ABS CFR China"]];
url.value=localStorage.pf_url||""; dt.value=new Date().toISOString().slice(0,10); targets.innerHTML=TARGETS.map(x=>`<label class="row">${x[1]}<input data-code="${x[0]}" inputmode="decimal" placeholder="${x[0]}"></label>`).join('');
async function save(){const u=url.value.trim(),p=pw.value,d=dt.value;if(!u||!p||!d){msg.textContent="URL / password / date를 확인하세요.";return}localStorage.pf_url=u;const values={};document.querySelectorAll('[data-code]').forEach(e=>{if(e.value.trim()!=="")values[e.dataset.code]=Number(e.value)});msg.textContent="저장 중…";try{const body=new URLSearchParams({action:"save",password:p,date:d,values:JSON.stringify(values)});const r=await fetch(u,{method:"POST",body});const j=await r.json();if(!j.ok)throw new Error(j.error||"save failed");msg.textContent=`저장 완료 · ${j.updated}개 가격 반영${j.dispatched?" · GitHub rebuild 요청 완료":""}`;}catch(e){msg.textContent="오류: "+e.message}}
</script></body></html>
