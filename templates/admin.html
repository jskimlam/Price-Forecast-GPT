<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Price Forecast GPT · Admin</title>
<style>
:root{--bg:#06101d;--p:#0b1b2d;--line:#1b3a57;--text:#f3f7fb;--muted:#91a7bc;--cyan:#35c2ff;--gold:#f5c35a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#102a46,#06101d 38%,#040b14);color:var(--text);font-family:Inter,Pretendard,system-ui,sans-serif}
.w{max-width:1320px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.ey{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.16em}
h1{margin:2px 0 6px;font-size:clamp(24px,3vw,38px)}.sub{color:var(--muted);font-size:13px}.box{margin-top:14px;background:linear-gradient(180deg,#0c1d30,#091725);border:1px solid var(--line);border-radius:17px;padding:16px}
.auth{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}label{font-size:11px;color:#a9bed0;letter-spacing:.03em}input{width:100%;margin-top:5px;background:#071522;border:1px solid #274a67;color:#fff;padding:10px;border-radius:9px;outline:0}input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #35c2ff22}
.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toggle{display:flex;gap:8px;align-items:center;color:#b9c9d8;font-size:12px}.toggle input{width:auto;margin:0}
.group{margin-top:16px}.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.gh b{font-size:13px}.gh span{font-size:10px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.card{background:#091929;border:1px solid #173650;border-radius:12px;padding:10px}.card.target{border-color:#7e682b;background:linear-gradient(180deg,#241f12,#0d1a26)}.card.target .name{color:#ffdd72}.code{font-size:10px;color:#6f8ca6}.name{font-size:12px;font-weight:750;margin:3px 0}.tag{display:inline-flex;border:1px solid #31506a;border-radius:999px;padding:2px 6px;font-size:9px;color:#93acc3}.target .tag{border-color:#8b7230;color:#f5c35a}
.actions{position:sticky;bottom:0;margin-top:16px;background:#071522e8;border:1px solid #214460;border-radius:14px;padding:12px;backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;gap:12px}
button{border:0;border-radius:10px;background:linear-gradient(90deg,#35c2ff,#7aa7ff);color:#06111d;font-weight:900;padding:11px 18px;cursor:pointer}.msg{color:#8ee0b5;font-size:12px}
@media(max-width:980px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.auth{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.w{padding:10px}.top{display:block}}@media(max-width:430px){.cards{grid-template-columns:1fr 1fr}.card{padding:8px}.name{font-size:11px}}
</style></head><body><div class="w">
<div class="top"><div><div class="ey">PETROCHEM FORECAST ENGINE</div><h1>Market Data Admin</h1><div class="sub">27개 Driver 업데이트 → 12개 Target 예측 → GitHub Pages 자동 재빌드</div></div><div class="sub">노란 카드 = Forecast Target</div></div>
<div class="box"><div class="auth"><label>Apps Script Web App URL<input id="url" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Admin Password<input id="pw" type="password"></label><label>Assessment Date<input id="dt" type="date"></label></div></div>
<div class="box"><div class="toolbar"><div><b>Market Inputs</b><div class="sub">빈 칸은 기존 값을 건드리지 않습니다.</div></div><label class="toggle"><input id="only" type="checkbox" onchange="render()">Forecast Target만 보기</label></div><div id="groups"></div></div>
<div class="actions"><div id="msg" class="msg">입력 대기</div><button onclick="save()">Save & Rebuild Forecast</button></div>
</div><script>
const V=[
['NMCL001','WTI NYMEX','Energy',1],['PAAAD00','Naphtha CFR Japan','Energy',1],['PCACG00','WTI Cushing Mo01','Energy',0],
['AAMFI00','SM CFR China','Styrene',1],['AAMFL00','SM FOB Korea','Styrene',0],['PHACB00','SM CFR Taiwan','Styrene',0],['STYFC00','SM FOB China','Styrene',0],['AAOTU00','SM East China CNY','Styrene',0],['AAOQP00','SM FOB ARA','Styrene',0],['AAIKW00','SM FOB USG','Styrene',0],
['PHASM05','Benzene FOB Korea','Aromatics',1],['AAOAX00','Benzene CIF ARA','Aromatics',0],['AAKYD00','Benzene FOB USG','Aromatics',0],['PHASO05','Toluene FOB Korea','Aromatics',0],
['AAOTM00','Ethylene CFR NE Asia','Olefins',1],['AAWWK00','Propylene CFR China','Olefins',1],
['BTNEA00','Butadiene CFR NE Asia','Butadiene',1],['AAWWM00','Butadiene FOB Korea','Butadiene',0],['AAWWL00','Butadiene CFR China','Butadiene',0],['AAWWU00','Butadiene China Domestic','Butadiene',0],
['PHAOO00','ACN CFR FE Asia','Acrylonitrile',1],
['PHBIF00','PP Inj CFR FE Asia','Resins',1],['PHAIL00','PS GP CFR China','Resins',1],['PHAIR00','HIPS CFR China','Resins',1],['PHAHF00','ABS Inj CFR China','Resins',1],
['AAVCC00','Freight USG-Korea 10-12kt','Freight',0],['AAVCA00','Freight Korea-East China 5kt','Freight',0]
];
url.value=localStorage.pf_url||'';dt.value=new Date().toISOString().slice(0,10);
function render(){const targetOnly=only.checked;const gs={};V.filter(v=>!targetOnly||v[3]).forEach(v=>(gs[v[2]]??=[]).push(v));groups.innerHTML=Object.entries(gs).map(([g,a])=>`<div class="group"><div class="gh"><b>${g}</b><span>${a.length} series</span></div><div class="cards">${a.map(v=>`<label class="card ${v[3]?'target':''}"><div class="code">${v[0]}</div><div class="name">${v[1]}</div><span class="tag">${v[3]?'FORECAST TARGET':'DRIVER'}</span><input data-code="${v[0]}" inputmode="decimal" placeholder="price"></label>`).join('')}</div></div>`).join('')}
async function save(){const u=url.value.trim(),p=pw.value,d=dt.value;if(!u||!p||!d){msg.textContent='URL / password / date를 확인해줘.';return}localStorage.pf_url=u;const values={};document.querySelectorAll('[data-code]').forEach(e=>{if(e.value.trim()!=='')values[e.dataset.code]=Number(e.value)});if(!Object.keys(values).length){msg.textContent='가격을 하나 이상 입력해줘.';return}msg.textContent='저장 중…';try{const body=new URLSearchParams({action:'save',password:p,date:d,values:JSON.stringify(values)});const r=await fetch(u,{method:'POST',body});const j=await r.json();if(!j.ok)throw new Error(j.error||'save failed');msg.textContent=`저장 완료 · ${j.updated}개 반영${j.dispatched?' · Forecast 재빌드 요청 완료':' · 재빌드 미요청'}`;if(j.dispatchError)msg.textContent+=' ('+j.dispatchError+')'}catch(e){msg.textContent='오류: '+e.message}}
render();
</script></body></html>
